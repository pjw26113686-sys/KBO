[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kbo-ev"
version = "0.1.0"
description = "KBO 스코어 예측 · EV 베팅 (핵심 + 합성 시뮬레이션)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["kbo", "kbo.model", "kbo.ev", "kbo.sim", "kbo.backtest", "kbo.data"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
